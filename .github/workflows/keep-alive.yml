name: Keep Render service alive

# الخطة المجانية على Render توقف السيرفر تلقائيًا بعد ~15 دقيقة من عدم الاستخدام، فأول طلب
# بعدها بياخد 20-60 ثانية "إيقاظ" — وده اللي كان بيظهر كبطء عام فى البرنامج. بدل الاعتماد على
# خدمة كرون خارجية (زي cron-job.org) ممكن توقف من غير إشعار، بنستخدم GitHub Actions نفسه
# (المشروع Public فمفيش أي حدود/تكلفة على الدقائق) عشان يضرب /api/health كل 5 دقايق باستمرار
# ويخلي كل من Render وقاعدة بيانات Neon (اللي هي كمان serverless وممكن تنام) صاحيين طول الوقت.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          set -e
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 https://ftc2-z4av.onrender.com/api/health || echo "000")
            echo "المحاولة $i: HTTP $code"
            cat /tmp/health.json 2>/dev/null || true
            echo ""
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "فشلت كل المحاولات — السيرفر لم يستجب بنجاح"
          exit 1
