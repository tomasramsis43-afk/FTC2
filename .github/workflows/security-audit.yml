name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'electron-desktop/package.json'
      - 'electron-desktop/package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'electron-desktop/package.json'
      - 'electron-desktop/package-lock.json'
  schedule:
    # أسبوعياً كل يوم أحد الساعة 6 صباحاً UTC، لرصد أي ثغرة جديدة حتى لو محدش عدّل package.json
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

jobs:
  npm-audit-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit server (moderate+)
        run: |
          npx --yes audit-ci --moderate \
            --allowlist GHSA-gh4j-gqv2-49f6
  npm-audit-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit desktop (moderate+)
        run: npx --yes audit-ci --moderate
